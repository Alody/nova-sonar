# Nova Sonar 7.1-to-binaural Game sink.
#
# This is loaded by `pipewire -c filter-chain.conf` through the dedicated
# nova-sonar-game.service.  Every SOFA filename is intentionally repeated so
# nova-sonar-hrtf can switch the complete graph atomically.

context.modules = [
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "Nova Sonar Game Spatializer"
            media.name = "Nova Sonar Game Spatializer"

            filter.graph = {
                nodes = [
                    # An input may only be connected once.  Copy nodes provide
                    # one branch for HRTF processing and one for dry downmix.
                    { type = builtin name = copy_fl  label = copy }
                    { type = builtin name = copy_fr  label = copy }
                    { type = builtin name = copy_fc  label = copy }
                    { type = builtin name = copy_lfe label = copy }
                    { type = builtin name = copy_rl  label = copy }
                    { type = builtin name = copy_rr  label = copy }
                    { type = builtin name = copy_sl  label = copy }
                    { type = builtin name = copy_sr  label = copy }

                    # PipeWire azimuth: 0 front, 90 left, 180 rear, 270 right.
                    { type = sofa name = hrtf_fl label = spatializer
                        config = { blocksize = 128 tailsize = 1024 filename = "@HRTF_DIR@/ari_dtf_d_nh1230.sofa" }
                        control = { "Azimuth" = 30.0 "Elevation" = 0.0 "Radius" = 1.0 }
                    }
                    { type = sofa name = hrtf_fr label = spatializer
                        config = { blocksize = 128 tailsize = 1024 filename = "@HRTF_DIR@/ari_dtf_d_nh1230.sofa" }
                        control = { "Azimuth" = 330.0 "Elevation" = 0.0 "Radius" = 1.0 }
                    }
                    { type = sofa name = hrtf_fc label = spatializer
                        config = { blocksize = 128 tailsize = 1024 filename = "@HRTF_DIR@/ari_dtf_d_nh1230.sofa" }
                        control = { "Azimuth" = 0.0 "Elevation" = 0.0 "Radius" = 1.0 }
                    }
                    { type = sofa name = hrtf_lfe label = spatializer
                        config = { blocksize = 128 tailsize = 1024 filename = "@HRTF_DIR@/ari_dtf_d_nh1230.sofa" }
                        control = { "Azimuth" = 0.0 "Elevation" = -30.0 "Radius" = 1.0 }
                    }
                    { type = sofa name = hrtf_rl label = spatializer
                        config = { blocksize = 128 tailsize = 1024 filename = "@HRTF_DIR@/ari_dtf_d_nh1230.sofa" }
                        control = { "Azimuth" = 110.0 "Elevation" = 0.0 "Radius" = 1.0 }
                    }
                    { type = sofa name = hrtf_rr label = spatializer
                        config = { blocksize = 128 tailsize = 1024 filename = "@HRTF_DIR@/ari_dtf_d_nh1230.sofa" }
                        control = { "Azimuth" = 250.0 "Elevation" = 0.0 "Radius" = 1.0 }
                    }
                    { type = sofa name = hrtf_sl label = spatializer
                        config = { blocksize = 128 tailsize = 1024 filename = "@HRTF_DIR@/ari_dtf_d_nh1230.sofa" }
                        control = { "Azimuth" = 90.0 "Elevation" = 0.0 "Radius" = 1.0 }
                    }
                    { type = sofa name = hrtf_sr label = spatializer
                        config = { blocksize = 128 tailsize = 1024 filename = "@HRTF_DIR@/ari_dtf_d_nh1230.sofa" }
                        control = { "Azimuth" = 270.0 "Elevation" = 0.0 "Radius" = 1.0 }
                    }

                    # Eight inputs sum to at most unity before the HRTF filters.
                    # This conservative headroom avoids overload on dense 7.1.
                    { type = builtin name = wet_l label = mixer
                        control = { "Gain 1" = 0.125 "Gain 2" = 0.125 "Gain 3" = 0.125 "Gain 4" = 0.125 "Gain 5" = 0.125 "Gain 6" = 0.125 "Gain 7" = 0.125 "Gain 8" = 0.125 }
                    }
                    { type = builtin name = wet_r label = mixer
                        control = { "Gain 1" = 0.125 "Gain 2" = 0.125 "Gain 3" = 0.125 "Gain 4" = 0.125 "Gain 5" = 0.125 "Gain 6" = 0.125 "Gain 7" = 0.125 "Gain 8" = 0.125 }
                    }

                    # Normalized ITU-style downmix: relative center/surround
                    # balance is -3 dB and the absolute coefficient sum is 1.
                    { type = builtin name = dry_l label = mixer
                        control = { "Gain 1" = 0.276142 "Gain 2" = 0.195262 "Gain 3" = 0.138071 "Gain 4" = 0.195262 "Gain 5" = 0.195262 }
                    }
                    { type = builtin name = dry_r label = mixer
                        control = { "Gain 1" = 0.276142 "Gain 2" = 0.195262 "Gain 3" = 0.138071 "Gain 4" = 0.195262 "Gain 5" = 0.195262 }
                    }

                    # These stable control names are the runtime spatial
                    # enable/bypass API used by pipewire_spatial.py.
                    { type = builtin name = final_l label = mixer
                        control = { "Gain 1" = 1.0 "Gain 2" = 0.0 }
                    }
                    { type = builtin name = final_r label = mixer
                        control = { "Gain 1" = 1.0 "Gain 2" = 0.0 }
                    }
                ]

                links = [
                    { output = "copy_fl:Out"  input = "hrtf_fl:In" }
                    { output = "copy_fr:Out"  input = "hrtf_fr:In" }
                    { output = "copy_fc:Out"  input = "hrtf_fc:In" }
                    { output = "copy_lfe:Out" input = "hrtf_lfe:In" }
                    { output = "copy_rl:Out"  input = "hrtf_rl:In" }
                    { output = "copy_rr:Out"  input = "hrtf_rr:In" }
                    { output = "copy_sl:Out"  input = "hrtf_sl:In" }
                    { output = "copy_sr:Out"  input = "hrtf_sr:In" }

                    { output = "hrtf_fl:Out L"  input = "wet_l:In 1" }
                    { output = "hrtf_fr:Out L"  input = "wet_l:In 2" }
                    { output = "hrtf_fc:Out L"  input = "wet_l:In 3" }
                    { output = "hrtf_lfe:Out L" input = "wet_l:In 4" }
                    { output = "hrtf_rl:Out L"  input = "wet_l:In 5" }
                    { output = "hrtf_rr:Out L"  input = "wet_l:In 6" }
                    { output = "hrtf_sl:Out L"  input = "wet_l:In 7" }
                    { output = "hrtf_sr:Out L"  input = "wet_l:In 8" }
                    { output = "hrtf_fl:Out R"  input = "wet_r:In 1" }
                    { output = "hrtf_fr:Out R"  input = "wet_r:In 2" }
                    { output = "hrtf_fc:Out R"  input = "wet_r:In 3" }
                    { output = "hrtf_lfe:Out R" input = "wet_r:In 4" }
                    { output = "hrtf_rl:Out R"  input = "wet_r:In 5" }
                    { output = "hrtf_rr:Out R"  input = "wet_r:In 6" }
                    { output = "hrtf_sl:Out R"  input = "wet_r:In 7" }
                    { output = "hrtf_sr:Out R"  input = "wet_r:In 8" }

                    { output = "copy_fl:Out"  input = "dry_l:In 1" }
                    { output = "copy_fc:Out"  input = "dry_l:In 2" }
                    { output = "copy_lfe:Out" input = "dry_l:In 3" }
                    { output = "copy_rl:Out"  input = "dry_l:In 4" }
                    { output = "copy_sl:Out"  input = "dry_l:In 5" }
                    { output = "copy_fr:Out"  input = "dry_r:In 1" }
                    { output = "copy_fc:Out"  input = "dry_r:In 2" }
                    { output = "copy_lfe:Out" input = "dry_r:In 3" }
                    { output = "copy_rr:Out"  input = "dry_r:In 4" }
                    { output = "copy_sr:Out"  input = "dry_r:In 5" }

                    { output = "wet_l:Out" input = "final_l:In 1" }
                    { output = "dry_l:Out" input = "final_l:In 2" }
                    { output = "wet_r:Out" input = "final_r:In 1" }
                    { output = "dry_r:Out" input = "final_r:In 2" }
                ]

                inputs = [
                    "copy_fl:In" "copy_fr:In" "copy_fc:In" "copy_lfe:In"
                    "copy_rl:In" "copy_rr:In" "copy_sl:In" "copy_sr:In"
                ]
                outputs = [ "final_l:Out" "final_r:Out" ]
            }

            capture.props = {
                node.name = "nova_sonar_game"
                node.description = "Nova Sonar Game"
                media.class = Audio/Sink
                audio.channels = 8
                audio.position = [ FL FR FC LFE RL RR SL SR ]
                session.suspend-timeout-seconds = 0
            }

            playback.props = {
                node.name = "output.nova_sonar_game"
                node.description = "Nova Sonar Game Output"
                node.passive = true
                target.object = "nova_sonar_eq"
                audio.channels = 2
                audio.position = [ FL FR ]
            }
        }
    }
]
