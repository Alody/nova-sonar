context.modules = [
    {
        name = libpipewire-module-filter-chain
        args = {
            node.description = "Nova Sonar Microphone EQ"
            media.name = "Nova Sonar Microphone EQ"
            audio.channels = 1
            audio.position = [ MONO ]

            filter.graph = {
                nodes = [
                    {
                        type = builtin
                        name = mic_input
                        label = copy
                    }
                    {
                        type = ladspa
                        name = rnnoise
                        plugin = "@RNNOISE_PLUGIN@"
                        label = noise_suppressor_mono
                        control = {
                            "VAD Threshold (%)" = 85.0
                            "VAD Grace Period (ms)" = 200
                            "Retroactive VAD Grace (ms)" = 0
                        }
                    }
                    {
                        type = builtin
                        name = noise_mix
                        label = mixer
                        control = { "Gain 1" = 1.0 "Gain 2" = 0.0 }
                    }
                    {
                        type = lv2
                        name = mic_eq
                        plugin = "http://lsp-plug.in/plugins/lv2/para_equalizer_x8_mono"
                        control = {
                            "enabled" = 1
                            "mode" = 0
                            "g_in" = 1.0
                            "g_out" = 1.0
                            "ft_0" = 5 "f_0" = 80.0   "g_0" = 1.0 "q_0" = 0.7
                            "ft_1" = 1 "f_1" = 200.0  "g_1" = 1.0 "q_1" = 1.2
                            "ft_2" = 1 "f_2" = 500.0  "g_2" = 1.0 "q_2" = 1.2
                            "ft_3" = 1 "f_3" = 1000.0 "g_3" = 1.0 "q_3" = 1.2
                            "ft_4" = 1 "f_4" = 3000.0 "g_4" = 1.0 "q_4" = 1.2
                            "ft_5" = 3 "f_5" = 8000.0 "g_5" = 1.0 "q_5" = 0.7
                            "ft_6" = 2 "f_6" = 70.0 "s_6" = 1
                        }
                    }
                ]
                links = [
                    { output = "mic_input:Out" input = "rnnoise:Input" }
                    { output = "rnnoise:Output" input = "noise_mix:In 1" }
                    { output = "mic_input:Out" input = "noise_mix:In 2" }
                    { output = "noise_mix:Out" input = "mic_eq:in" }
                ]
                inputs = [ "mic_input:In" ]
                outputs = [ "mic_eq:out" ]
            }

            capture.props = {
                node.name = "input.nova_sonar_mic"
                target.object = "@MIC_SOURCE@"
                node.passive = true
                audio.channels = 1
                audio.rate = 48000
                audio.position = [ MONO ]
            }

            playback.props = {
                node.name = "nova_sonar_mic"
                node.description = "Nova Sonar Microphone"
                media.class = "Audio/Source"
                session.suspend-timeout-seconds = 0
                audio.channels = 1
                audio.rate = 48000
                audio.position = [ MONO ]
            }
        }
    }
]
